,0.10251660640771787,0.07211645894330015,0.0329305038522055,0.005137590123934185,0.14026230726532413,0.12438611360051313,0.10689882363332737,0.14249945459820348,0.11359427450317816,0.12792502842800157,0.16036484671942286,0.3238228808979253,0.14748102562663729,0.1400167560723664,0.08287342217188477,0.06416886492722301,0.05685651937963364,0.24607031715053412,0.058800220043920506,0.24518495121704476,0.2800105588263293,0.10710259638865395,0.3394319924535708,0.13276410918966847,0.11518086624101914,0.045150323085508634,0.09623504540618039,0.08171507794751964,0.06952237756924388,0.07833638539592466,0.16685555922408649,0.22141364103692737,0.05062841260954362,0.03572777920973029,0.07721424396650034,0.09483173731828623],"fixed":[0,5,10,15,20,25,30,35,40,45,50,55,60,65],"display_fixed":[0,5,10,15,20,25,30,35,40,45,50,55,60,65],"display_fixed_vertices":[],"energy":6.360153581276665,"morph_t":1.0}];
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const slider = document.getElementById("slider");
const play = document.getElementById("play");
const stats = document.getElementById("stats");
let timer = null;

function project(p) {
  const margin = 52;
  const r = (canvas.width - 2 * margin) / 2;
  return [
    canvas.width / 2 + p[0] * r,
    canvas.height / 2 - p[1] * r
  ];
}

function norm2(p) {
  return p[0] * p[0] + p[1] * p[1];
}

function normalizeAngle(delta) {
  while (delta <= -Math.PI) delta += Math.PI * 2;
  while (delta > Math.PI) delta -= Math.PI * 2;
  return delta;
}

function geodesicPoints(a, b) {
  const det = a[0] * b[1] - a[1] * b[0];
  const samples = 36;

  if (Math.abs(det) < 1e-10) {
    return [a, b];
  }

  // Poincare disk geodesics are circles orthogonal to the unit circle.
  // Their Euclidean center c satisfies 2 c.p = |p|^2 + 1 for both endpoints.
  const rhsA = (norm2(a) + 1) * 0.5;
  const rhsB = (norm2(b) + 1) * 0.5;
  const center = [
    (rhsA * b[1] - rhsB * a[1]) / det,
    (a[0] * rhsB - b[0] * rhsA) / det
  ];
  const radius = Math.hypot(a[0] - center[0], a[1] - center[1]);
  if (!Number.isFinite(radius) || radius <= 1e-10) {
    return [a, b];
  }

  const start = Math.atan2(a[1] - center[1], a[0] - center[0]);
  const end = Math.atan2(b[1] - center[1], b[0] - center[0]);
  let delta = normalizeAngle(end - start);

  const midShort = [
    center[0] + radius * Math.cos(start + delta * 0.5),
    center[1] + radius * Math.sin(start + delta * 0.5)
  ];
  if (norm2(midShort) > 1 + 1e-7) {
    delta += delta > 0 ? -Math.PI * 2 : Math.PI * 2;
  }

  const points = [];
  for (let k = 0; k <= samples; k++) {
    const t = k / samples;
    const angle = start + delta * t;
    points.push([
      center[0] + radius * Math.cos(angle),
      center[1] + radius * Math.sin(angle)
    ]);
  }
  return points;
}

function drawFundamentalDomain(domainVertices) {
  if (!domainVertices || domainVertices.length < 3) {
    return;
  }

  ctx.save();
  ctx.setLineDash([]);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#000000";
  ctx.lineWidth = 2.4;

  for (let k = 0; k < domainVertices.length; k++) {
    const a = domainVertices[k];
    const b = domainVertices[(k + 1) % domainVertices.length];
    const points = geodesicPoints(a, b).map(project);
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let p = 1; p < points.length; p++) {
      ctx.lineTo(points[p][0], points[p][1]);
    }
    ctx.stroke();
  }

  ctx.restore();
}

function draw(index) {
  const frame = frames[index];
  const vertices = frame.vertices;
  const edges = frame.edges;
  const fixedList = frame.fixed || [];
  const displayFixedList = frame.display_fixed || fixedList;
  const domainVertices = frame.display_fixed_vertices && frame.display_fixed_vertices.length
    ? frame.display_fixed_vertices
    : displayFixedList.map((i) => vertices[i]).filter(Boolean);
  const boundaryCount = displayFixedList.length >= 2
    ? displayFixedList.length * (displayFixedList[1] - displayFixedList[0])
    : 0;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const unitCenter = project([0, 0]);
  const unitEdge = project([1, 0]);
  const unitRadius = Math.abs(unitEdge[0] - unitCenter[0]);
  ctx.beginPath();
  ctx.arc(unitCenter[0], unitCenter[1], unitRadius, 0, Math.PI * 2);
  ctx.fillStyle = "#fbfcfd";
  ctx.fill();
  ctx.strokeStyle = "#1f2937";
  ctx.lineWidth = 2;
  ctx.stroke();

  drawFundamentalDomain(domainVertices);

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#138a2e";
  ctx.lineWidth = 2.4;
  for (let e = 0; e < edges.length; e++) {
    const [i, j] = edges[e];
    const points = geodesicPoints(vertices[i], vertices[j]).map(project);
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let k = 1; k < points.length; k++) {
      ctx.lineTo(points[k][0], points[k][1]);
    }
    ctx.stroke();
  }

  for (let i = 0; i < vertices.length; i++) {
    const p = project(vertices[i]);
    ctx.beginPath();
    ctx.arc(p[0], p[1], 2.2, 0, Math.PI * 2);
    ctx.fillStyle = i < boundaryCount ? "#dc2626" : "#111827";
    ctx.fill();
  }

  const energy = Number(frame.energy);
  const morphT = Number(frame.morph_t);
  stats.textContent = `${frame.name}  t=${Number.isFinite(morphT) ? morphT.toFixed(3) : "n/a"}  energy=${Number.isFinite(energy) ? energy.toFixed(6) : "n/a"}`;
}

function setFrame(index) {
  slider.value = String(index);
  draw(index);
}

slider.addEventListener("input", () => draw(Number(slider.value)));
play.addEventListener("click", () => {
  if (timer) {
    clearInterval(timer);
    timer = null;
    play.textContent = "Play";
    return;
  }
  play.textContent = "Pause";
  timer = setInterval(() => {
    const next = (Number(slider.value) + 1) % frames.length;
    setFrame(next);
  }, 180);
});

draw(0);
</script>
