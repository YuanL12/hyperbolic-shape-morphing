<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Z0 to Z1 Half-20 Mean-Value Morph, Depth 0</title>
  <style>
    :root { font-family: Avenir, Helvetica, Arial, sans-serif; background: #f8fafc; color: #172033; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    header, footer { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-color: #d9dee8; }
    header { border-bottom: 1px solid #d9dee8; }
    footer { border-top: 1px solid #d9dee8; }
    h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0; }
    main { display: grid; place-items: center; padding: 18px; overflow: hidden; }
    img { width: min(88vmin, 980px); height: min(88vmin, 980px); object-fit: contain; display: block; }
    .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    button { border: 1px solid #aeb7c7; background: #fff; color: #172033; height: 34px; padding: 0 12px; border-radius: 6px; font: inherit; cursor: pointer; }
    input[type="range"] { width: min(46vw, 460px); }
    .readout { min-width: 150px; font-variant-numeric: tabular-nums; color: #46556d; }
  </style>
</head>
<body>
  <header><h1>Z0 to Z1 half-20 mean-value morph · depth 0</h1></header>
  <main><img id="frame" alt="depth 0 checkerboard morph frame" src="../output/checkerboard_morph/Z0_to_Z1_half20_mean_value/depth0/frame_000.svg"></main>
  <footer>
    <div class="controls">
      <button id="play">Play</button>
      <input id="slider" type="range" min="0" max="49" step="1" value="0">
      <span class="readout" id="readout">frame 000 · t=0.000</span>
    </div>
  </footer>
  <script>
    const depth = 0;
    const totalFrames = 50;
    const frame = document.getElementById("frame");
    const slider = document.getElementById("slider");
    const readout = document.getElementById("readout");
    const play = document.getElementById("play");
    let timer = null;
    function name(index) { return String(index).padStart(3, "0"); }
    function update() {
      const index = Number(slider.value);
      const n = name(index);
      frame.src = `../output/checkerboard_morph/Z0_to_Z1_half20_mean_value/depth${depth}/frame_${n}.svg`;
      readout.textContent = `frame ${n} · t=${(index / (totalFrames - 1)).toFixed(3)}`;
    }
    function stop() { if (timer !== null) clearInterval(timer); timer = null; play.textContent = "Play"; }
    slider.addEventListener("input", update);
    play.addEventListener("click", () => {
      if (timer !== null) { stop(); return; }
      play.textContent = "Pause";
      timer = setInterval(() => { slider.value = String((Number(slider.value) + 1) % totalFrames); update(); }, 90);
    });
    update();
  </script>
</body>
</html>
